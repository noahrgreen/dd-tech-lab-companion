module: counterparty_risk_investigation
layout: split_pane
primary_pane:
  object_card:
    target: Counterparty
    sections:
      - header:
          fields: [legal_name, jurisdiction, risk_rating, last_kyc_refresh]
          conditional_formatting:
            risk_rating == "critical": "background: #c00; color: white"
      - summary:
          content:
            - field: aip_grounded_risk_summary
            - citations_required: true
      - relationships:
          widgets:
            - TransactedWith: top_10_by_volume
            - UltimateBeneficialOwner: all
            - SanctionsHit: active_only
secondary_pane:
  contextual_navigator:
    - if: section == "TransactedWith"
      show: transaction_volume_time_series_chart
    - if: section == "UltimateBeneficialOwner"
      show: ownership_graph_visualization
    - if: section == "SanctionsHit"
      show: sanctions_list_full_text
actions:
  - ElevateRiskRating
  - InitiateEnhancedDueDiligence
performance_patterns:
  object_set_pagination: true
  lazy_load_contextual_navigator: true
  search_index_fields: [legal_name, jurisdiction, risk_rating, last_kyc_refresh]
